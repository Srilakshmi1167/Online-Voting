<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {
    display:flex; justify-content:center; align-items:center;
    height:100vh; background:#f3e5f5; font-family:Arial;
}
.card {
    background:white; padding:25px; border-radius:10px;
    width:350px;
}
h2 { text-align:center; color:#6a0dad; }
input {
    width:100%; padding:10px; margin:10px 0;
}
button {
    width:100%; padding:10px; background:#9b59b6;
    color:white; border:none;
}
.forgot {
    color:red; display:block; text-align:center; margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
<h2>Login</h2>

<form action="/login" method="post">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>

<a href="forgot.html" class="forgot">Forgot Password?</a>

</div>

</body>
</html>
